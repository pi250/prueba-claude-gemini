<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat con Claude</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #4b3fd1; color: #fff; padding: 14px 20px; font-size: 18px; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; }
  .user { align-self: flex-end; background: #4b3fd1; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; color: #222; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .error { background: #fde8e8; color: #a11; }
  form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #ddd; }
  textarea { flex: 1; resize: none; padding: 10px; border: 1px solid #ccc; border-radius: 10px; font: inherit; height: 48px; }
  button { background: #4b3fd1; color: #fff; border: none; border-radius: 10px; padding: 0 20px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>Chat con Claude</header>
<div id="chat"><div class="msg bot">Hola, soy tu agente desarrollador. ¿Qué quieres que construya?</div></div>
<form id="form">
  <textarea id="input" placeholder="Escribe un mensaje... (Enter para enviar, Shift+Enter nueva línea)"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>
<script>
  const WEBHOOK_URL = 'https://marcosbot.app.n8n.cloud/webhook/chat-claude';
  let sessionId = localStorage.getItem('chatSessionId');
  if (!sessionId) {
    sessionId = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('chatSessionId', sessionId);
  }
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    send.disabled = true;
    const thinking = addMsg('Pensando...', 'bot');
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId })
      });
      if (!res.ok) throw new Error('Error ' + res.status);
      const data = await res.json();
      thinking.textContent = data.reply || '(sin respuesta)';
    } catch (err) {
      thinking.textContent = 'No se pudo contactar con el agente: ' + err.message;
      thinking.classList.add('error');
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
